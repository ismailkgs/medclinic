services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--hostname=http://localhost:8081", "--import-realm"]
    ports:
      - "127.0.0.1:8081:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: medical_admin_local_2026

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  postgres:
    image: postgres:18-alpine
    profiles: ["full"]
    environment:
      POSTGRES_DB: medical_platform
      POSTGRES_USER: medical_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medical_local_2026}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_app -d medical_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    profiles: ["full"]
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8082}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/medical_platform
      DB_USER: medical_app
      DB_PASSWORD: ${DB_PASSWORD:-medical_local_2026}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER: http://localhost:8081/realms/medical
      LIQUIBASE_CONTEXTS: demo
      MEDICAL_SMS_MODE: ${MEDICAL_SMS_MODE:-log}
      MEDICAL_SMS_URL: ${MEDICAL_SMS_URL:-}
      MEDICAL_SMS_API_KEY: ${MEDICAL_SMS_API_KEY:-}
      MEDICAL_KAFKA_TOPIC_PREFIX: medical.docker
      SPRING_KAFKA_CONSUMER_GROUP_ID: medical-platform-docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  keycloak_data:
  kafka_data:
  postgres_data:
