spring.application.name=medical-platform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_platform}

spring.datasource.username=${DB_USER:medical_app}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.mvc.problemdetails.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8081/realms/medical}

spring.security.oauth2.resourceserver.jwt.audiences[0]=medical-api

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.acks=all

spring.kafka.producer.properties[enable.idempotence]=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=medical-platform

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.ack-mode=record

spring.kafka.admin.fail-fast=true

medical.zone=Asia/Bishkek

medical.jobs.enabled=${MEDICAL_JOBS_ENABLED:true}

medical.sms.mode=${MEDICAL_SMS_MODE:log}

medical.sms.url=${MEDICAL_SMS_URL:}

medical.sms.api-key=${MEDICAL_SMS_API_KEY:}

server.servlet.encoding.charset=UTF-8

server.servlet.encoding.force=true

spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:local}

medical.kafka.topic-prefix=${MEDICAL_KAFKA_TOPIC_PREFIX:medical}
