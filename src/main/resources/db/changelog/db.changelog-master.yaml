databaseChangeLog: # Начинает список изменений базы данных.
  - changeSet: # Объявляет одну миграцию, которую Liquibase отслеживает как отдельное изменение.
      id: 001-create-doctor-specialties # Задаёт уникальный идентификатор миграции внутри этого файла.
      author: ismail # Указывает автора миграции.
      changes: # Начинает список действий этой миграции.
        - createTable: # Просит Liquibase создать таблицу.
            tableName: doctor_specialties # Задаёт название таблицы специальностей врачей.
            columns: # Начинает описание столбцов таблицы.
              - column: # Начинает описание столбца идентификатора.
                  name: id # Называет столбец id.
                  type: BIGINT # Хранит идентификатор как 64-битное целое число.
                  autoIncrement: true # Поручает базе автоматически генерировать идентификаторы.
                  constraints: # Задаёт ограничения столбца идентификатора.
                    primaryKey: true # Делает id первичным ключом таблицы.
                    nullable: false # Запрещает пустое значение идентификатора.
              - column: # Начинает описание столбца названия специальности.
                  name: name # Называет столбец name.
                  type: VARCHAR(100) # Хранит название длиной не более 100 символов.
                  constraints: # Задаёт ограничения названия специальности.
                    nullable: false # Запрещает отсутствие названия.
                    unique: true # Запрещает повторение одинакового названия в таблице.
  - changeSet: # Добавляет вторую миграцию в существующий список databaseChangeLog.
      id: 002-insert-doctor-specialties # Задаёт идентификатор миграции наполнения справочника.
      author: ismail # Указывает автора миграции.
      changes: # Начинает список действий миграции.
        - sql: # Объявляет действие с выполнением SQL.
            sql: | # Начинает многострочный текст SQL; следующие строки сохраняют переносы.
              INSERT INTO doctor_specialties (name) VALUES -- Указывает таблицу и столбец для добавления названий; id создаст база.
              ('Терапевт'), -- Добавляет специальность терапевта.
              ('Кардиолог'), -- Добавляет специальность кардиолога.
              ('Хирург'); -- Добавляет специальность хирурга и завершает SQL-команду.